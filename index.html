<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, responsive contact form demo." />
  <title>Contact Us | TestingMCP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="form-card" aria-labelledby="form-title">
      <div class="eyebrow"><span class="status-dot"></span> WE'RE HERE TO HELP</div>
      <h1 id="form-title">Let's talk<span>.</span></h1>
      <p class="intro">Have a question or an idea? Send us a message and we'll get back to you soon.</p>
      <form action="#" method="get">
        <div class="field-row">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field">
          <label for="subject">What is this about?</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>Choose a topic</option>
            <option>General question</option>
            <option>Project enquiry</option>
            <option>Feedback</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Your message</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell us a little about it..." required></textarea>
        </div>
        <button type="submit">Send message <span aria-hidden="true">↗</span></button>
        <p class="privacy-note">By sending this form, you agree to be contacted about your enquiry.</p>
      </form>
    </section>
    <footer>MADE WITH CARE <span>·</span> TESTINGMCP</footer>
  </main>
</body>
</html>
